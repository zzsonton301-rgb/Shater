name: "Kotlin Native Pure Production Build"

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. سحب الكود من المستودع
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      # 2. تهيئة بيئة جافا المتوافقة مع أندرويد
      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. تهيئة بيئة أندرويد SDK وتجنب خطأ الحزم الملغاة
      - name: 3. Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      # 4. ضبط أو توليد Gradle Wrapper بإصدار 8.7 المتوافق تماماً مع AGP 8.5.2
      - name: 4. Setup Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      # 5. توليد ملف التوقيع تلقائياً في المسار الصحيح وضبط متغيرات البيئة
      - name: 5. Generate Keystore Automatically
        run: |
          keytool -genkey -v -keystore app/release-key.jks \
            -alias traderpro_alias -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "android_pass_2026" -keypass "android_pass_2026" \
            -dname "CN=TraderPro, OU=Native, O=Kotlin, L=Cairo, S=Egypt, C=EG"

      # 6. تنظيف المشروع وبناء الفواتير والحزم الموقعة بالكامل
      - name: 6. Build Android Binaries (Kotlin Native)
        env:
          ANDROID_KEYSTORE_FILE: "app/release-key.jks"
          ANDROID_KEYSTORE_PASSWORD: "android_pass_2026"
          ANDROID_KEY_ALIAS: "traderpro_alias"
          ANDROID_KEY_PASSWORD: "android_pass_2026"
        run: |
          ./gradlew clean
          ./gradlew assembleRelease --no-daemon --stacktrace
          ./gradlew bundleRelease --no-daemon --stacktrace

      # 7. تجهيز مسارات الملفات الناتجة وتسميتها للرفع
      - name: 7. Prepare Artifacts for Release
        run: |
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          AAB_PATH=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)
          
          cp "$APK_PATH" Final-Release-Signed.apk
          cp "$AAB_PATH" Final-Release-Signed.aab

      # 8. رفع النسخة النهائية كـ Release على المستودع
      - name: 8. Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Kotlin Native Release v${{ github.run_number }}"
          files: |
            Final-Release-Signed.apk
            Final-Release-Signed.aab
            app/release-key.jks
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
