name: Android Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag للإصدار، مثال v1.0.0"
        required: true
        default: "v1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  JAVA_VERSION: "17"
  ANDROID_API: "35"
  BUILD_TOOLS: "35.0.0"
  KEYSTORE_FILE: "${{ github.workspace }}/release-keystore.jks"

jobs:
  build-release:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # تم إزالة الحزمة القديمة "tools" لتجنب خطأ sdkmanager النهائي
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;${BUILD_TOOLS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # توليد ملف التوقيع والأسرار تلقائياً بالكامل دون الحاجة لأي GitHub Secrets
      - name: Generate Automatic Keystore and Credentials
        run: |
          echo "Generating automatic release keystore..."
          keytool -genkey -v -keystore "${{ env.KEYSTORE_FILE }}" \
            -alias "auto_release_alias" -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "auto_secure_pass_2026" -keypass "auto_secure_pass_2026" \
            -dname "CN=AutoAndroid, OU=Production, O=Shater, L=Cairo, S=Egypt, C=EG"

      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: "auto_secure_pass_2026"
          ANDROID_KEY_ALIAS: "auto_release_alias"
          ANDROID_KEY_PASSWORD: "auto_secure_pass_2026"
        run: |
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Verify outputs
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload APK, AAB, and checksums
        uses: actions/upload-artifact@v4
        with:
          name: shater-invoices-${{ steps.release.outputs.tag }}
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/**
            !app/build/outputs/mapping/release/**/*.txt

      - name: Create checksums
        run: sha256sum app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab > shater-invoices-${{ steps.release.outputs.tag }}-SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: شاطر للفواتير ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            shater-invoices-${{ steps.release.outputs.tag }}-SHA256SUMS.txt
